name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # El propio escáner revisa este repositorio: falla si hay vulnerabilidades altas o críticas.
      - name: depscan sobre este repo
        run: node apps/cli/dist/index.js . --fail-on high --format html --output depscan-report.html
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depscan-report
          path: depscan-report.html
          if-no-files-found: ignore
