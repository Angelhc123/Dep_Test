# Configuración de SonarCloud para DepScan.
# sonar.organization y sonar.projectKey deben coincidir con los que SonarCloud asigna
# al crear el proyecto en https://sonarcloud.io/projects/create (ver docs/CALIDAD.md).
sonar.organization=angelhc123
sonar.projectKey=Angelhc123_Dep_Test
sonar.projectName=DepScan

sonar.sources=apps/api/src,apps/cli/src,apps/web/src,packages/core/src
sonar.tests=apps/api/test,packages/core/test
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.d.ts,docs/**,benchmark/**
sonar.test.inclusions=**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
