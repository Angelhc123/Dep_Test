name: Calidad

# Aplica al propio proyecto DepScan las prácticas de los laboratorios de calidad
# (SonarCloud, Snyk, Semgrep, análisis estático de infraestructura): no modifica
# lógica de negocio, solo analiza el código ya existente.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  coverage:
    name: Tests + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: "Tests con cobertura (gate interno: 80% statements/lines/functions)"
        run: npm run test:coverage
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      # La v4 traía un Java 17 embebido que SonarCloud ya no acepta (pide 21+).
      # La versión actual descarga automáticamente el JRE que exige SonarCloud.
      - name: Analisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  snyk:
    name: Snyk (SAST + dependencias)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: snyk/actions/setup@master
      - name: Snyk code (SAST)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk code test --sarif-file-output=snyk-code.sarif || test "$?" -eq 1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Snyk open source (dependencias)
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' }}
        run: snyk test --all-projects --sarif-file-output=snyk-deps.sarif || test "$?" -eq 1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Guardar reportes de Snyk
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif', 'snyk-deps.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reportes
          path: |
            snyk-code.sarif
            snyk-deps.sarif
      - name: Publicar análisis de código
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
      - name: Publicar análisis de dependencias
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() && hashFiles('snyk-deps.sarif') != '' }}
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif || true
      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Publicar hallazgos en Semgrep AppSec Platform
        if: ${{ !cancelled() && github.event_name == 'push' && env.SEMGREP_APP_TOKEN != '' }}
        run: semgrep ci --code --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  iac:
    name: Análisis estático de infraestructura (Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint-iac
