name: Pruebas y reportes

# Automatización de pruebas de DepScan (unidad 2). Cada tipo de prueba corre en su
# propio job y deja su reporte HTML; el job "publicar" los reúne en GitHub Pages:
#   https://<owner>.github.io/<repo>/
#
#   unitarias + integración → Vitest (+ cobertura v8)        → /unitarias  /cobertura
#   mutación                → Stryker                         → /mutacion
#   sistema                 → Vitest contra el servidor real  → /sistema
#   interfaz de usuario     → Playwright (videos y trazas)    → /ui
#   aceptación (BDD)        → Gherkin + playwright-bdd        → /aceptacion
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarias:
    name: Unitarias + integración (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias e integración con cobertura (umbral 80 %)
        run: npx vitest run --coverage --reporter=default --reporter=html --reporter=junit
      - name: Resumen
        if: ${{ !cancelled() }}
        run: node scripts/resumen-pruebas.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-unitarias
          path: |
            reports/tests/
            reports/junit/vitest.xml
            coverage/
          retention-days: 30

  mutacion:
    name: Mutación (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas de mutación (falla si el puntaje < 50 %)
        run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-mutacion
          path: reports/mutation/
          retention-days: 30

  sistema:
    name: Sistema (servidor real por HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pruebas de sistema (API + SQLite + web + CLI compilados)
        run: npx vitest run -c vitest.sistema.config.ts --reporter=default --reporter=html --reporter=junit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-sistema
          path: |
            reports/sistema/
            reports/junit/sistema.xml
          retention-days: 30

  ui:
    name: Interfaz de usuario (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas de interfaz (escritorio y móvil, con video y traza)
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-ui
          path: |
            reports/ui/
            reports/junit/ui.xml
          retention-days: 30

  aceptacion:
    name: Aceptación de usuario (BDD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Escenarios Gherkin (CU-01, CU-04, CU-05, CU-08)
        run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-aceptacion
          path: |
            reports/bdd/
            reports/junit/aceptacion.xml
          retention-days: 30

  publicar:
    name: Publicar reportes en GitHub Pages
    needs: [unitarias, mutacion, sistema, ui, aceptacion]
    # Se publica aunque alguna prueba falle: el panel muestra qué falló.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: reporte-unitarias, path: . }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: reporte-mutacion, path: reports/mutation }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: reporte-sistema, path: reports }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: reporte-ui, path: reports }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: reporte-aceptacion, path: reports }
      - name: Reporte de depscan sobre este repo (dogfooding)
        continue-on-error: true
        # tests/fixtures contiene proyectos vulnerables A PROPÓSITO (datos de prueba): se excluyen.
        run: |
          rm -rf tests/fixtures
          mkdir -p site && node apps/cli/dist/index.js . --format html --output site/depscan-report.html
      - name: Ensamblar sitio
        run: |
          copiar() { [ -d "$1" ] && mkdir -p "site/$2" && cp -r "$1"/. "site/$2/" || true; }
          copiar reports/tests      unitarias
          copiar coverage           cobertura
          copiar reports/mutation   mutacion
          copiar reports/sistema    sistema
          copiar reports/ui         ui
          copiar reports/bdd        aceptacion
          node scripts/resumen-pruebas.mjs --json > site/resumen.json
          node scripts/pages-index.js > site/index.html
          node scripts/resumen-pruebas.mjs >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 Panel: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
