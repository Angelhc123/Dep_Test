# Configuración de SonarCloud para DepScan.
# sonar.organization y sonar.projectKey deben coincidir con los que SonarCloud asigna
# al crear el proyecto en https://sonarcloud.io/projects/create (ver docs/CALIDAD.md).
sonar.organization=angelhc123
sonar.projectKey=Angelhc123_Dep_Test
sonar.projectName=DepScan

sonar.sources=apps/api/src,apps/cli/src,apps/web/src,apps/vscode/src,packages/core/src
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.d.ts,docs/**,benchmark/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# La web (React) y la CLI se prueban con Playwright (UI/aceptación) y con las pruebas
# de sistema sobre el binario compilado, que no generan lcov. Se excluyen solo del
# cálculo de COBERTURA (siguen analizándose por bugs, vulnerabilidades y code smells).
# Las partes de la extensión que usan la API de VS Code se prueban con @vscode/test-electron (e2e).
sonar.coverage.exclusions=apps/web/src/**,apps/cli/src/**,apps/vscode/src/extension.ts,apps/vscode/src/controlador.ts,apps/vscode/src/proveedores.ts,apps/vscode/src/agente.ts,apps/vscode/src/motor.ts
sonar.tests=apps/api/test,packages/core/test,apps/vscode/test,tests
